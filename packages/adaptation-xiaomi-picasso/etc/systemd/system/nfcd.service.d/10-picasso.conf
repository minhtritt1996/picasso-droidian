# /dev/hwbinder (binderfs) and the container's NFC HAL only come up late in
# the boot; nfcd has no built-in retry, so it used to stay failed until a
# manual restart. Retry until binder-wait succeeds (same pattern as
# bluebinder.service which uses Restart=always).
[Service]
Restart=on-failure
RestartSec=10
