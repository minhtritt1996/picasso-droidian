# k30/picasso: re-assert usb0 netmask to /24 right after usb-tethering
# configures it. The stock script uses classful `ifconfig usb0 10.15.19.82`
# (no netmask) -> /8, whose route hijacks all 10/8 traffic including the
# home LAN. See /usr/local/bin/k30-usb0-netfix.sh for details.
[Service]
ExecStartPost=-/usr/local/bin/k30-usb0-netfix.sh
