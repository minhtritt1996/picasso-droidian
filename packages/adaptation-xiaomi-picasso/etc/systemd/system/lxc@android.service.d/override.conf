[Unit]
After=
After=android-mount.service
Wants=
Wants=android-mount.service

[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/lxc-info -n android | grep -q RUNNING || /usr/bin/lxc-start -d -n android; exec /usr/bin/lxc-wait -n android -s STOPPED'
ExecStop=
ExecStop=/usr/bin/lxc-stop -n android
TimeoutStopSec=30s
