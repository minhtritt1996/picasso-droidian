[Service]
# android-mount.service is Type=oneshot without RemainAfterExit, so every new
# pull (local-fs.target -> lxc@android.service) re-runs it. Without guards the
# ExecStartPost binds stack on top of each other and the kernel eventually
# attaches a self-mount on the bind source path, which later makes dpkg file
# replacement of that file fail with EXDEV ("cannot make backup link")/EBUSY.
# Keep the unit active after the first successful run and make each bind
# idempotent (only mount when the target is not already covered).
RemainAfterExit=yes
ExecStartPost=/bin/sh -c 'grep -qF " /var/lib/lxc/android/rootfs/vendor/lib64/libsdm_poll_fix.so " /proc/self/mountinfo || /usr/bin/mount -o bind /usr/lib/droid-vendor-overlay/lib64/libsdm_poll_fix.so /var/lib/lxc/android/rootfs/vendor/lib64/libsdm_poll_fix.so'
ExecStartPost=/bin/sh -c 'grep -qF " /android/vendor/lib64/libsdm_poll_fix.so " /proc/self/mountinfo || /usr/bin/mount -o bind /usr/lib/droid-vendor-overlay/lib64/libsdm_poll_fix.so /android/vendor/lib64/libsdm_poll_fix.so'
ExecStartPost=/bin/sh -c 'grep -qF " /var/lib/lxc/android/rootfs/vendor/etc/init/vendor.qti.hardware.display.composer-service.rc " /proc/self/mountinfo || /usr/bin/mount -o bind /usr/lib/droid-vendor-overlay/etc/init/vendor.qti.hardware.display.composer-service.rc /var/lib/lxc/android/rootfs/vendor/etc/init/vendor.qti.hardware.display.composer-service.rc'
ExecStartPost=/bin/sh -c 'grep -qF " /android/vendor/etc/init/vendor.qti.hardware.display.composer-service.rc " /proc/self/mountinfo || /usr/bin/mount -o bind /usr/lib/droid-vendor-overlay/etc/init/vendor.qti.hardware.display.composer-service.rc /android/vendor/etc/init/vendor.qti.hardware.display.composer-service.rc'
ExecStartPost=/bin/sh -c 'grep -qF " /var/lib/lxc/android/rootfs/vendor/etc/init/vendor.xiaomi.hardware.displayfeature@1.0-service.rc " /proc/self/mountinfo || /usr/bin/mount -o bind /usr/lib/droid-vendor-overlay/etc/init/vendor.xiaomi.hardware.displayfeature@1.0-service.rc /var/lib/lxc/android/rootfs/vendor/etc/init/vendor.xiaomi.hardware.displayfeature@1.0-service.rc'
ExecStartPost=/bin/sh -c 'grep -qF " /android/vendor/etc/init/vendor.xiaomi.hardware.displayfeature@1.0-service.rc " /proc/self/mountinfo || /usr/bin/mount -o bind /usr/lib/droid-vendor-overlay/etc/init/vendor.xiaomi.hardware.displayfeature@1.0-service.rc /android/vendor/etc/init/vendor.xiaomi.hardware.displayfeature@1.0-service.rc'
