[Unit]
Wants=seatd.service
After=seatd.service
OnFailure=

[Service]
TimeoutStartSec=180
Environment=WLR_BACKENDS=hwcomposer,libinput
Environment=EGL_PLATFORM=hwcomposer
Environment=WLR_HWC_SKIP_VERSION_CHECK=1
Environment=WLR_RENDERER=gles2
Environment=LIBSEAT_BACKEND=seatd
Environment=WLR_HWC_SYSFS_BACKLIGHT=/sys/class/backlight/backlight
Environment=WLR_HWC_IDLE_TIME=0
StandardInput=null
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
