# Host libhybris setprop cannot talk to the Halium 11 property service
# ("old property service protocol"); use the container's own setprop.
# The container property service needs a moment before it accepts writes, and
# this kernel randomly oopses/hangs processes (translation-fault bug), so give
# the container time to settle, bound every attempt with a timeout and retry.
# The unit must never block or fail the boot.
[Service]
Type=simple
ExecStart=
ExecStart=/bin/sh -c 'sleep 30; for i in $(seq 1 18); do timeout -k 3 10 /usr/bin/lxc-attach -n android -- /system/bin/setprop sys.boot_completed 1 && exit 0; sleep 10; done; exit 0'
