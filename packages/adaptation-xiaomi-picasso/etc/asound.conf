pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave {
            pcm "hw:0,0"
            rate 48000
            channels 2
            format S16_LE
        }
    }
    capture.pcm {
        type plug
        slave {
            pcm "hw:0,0"
            rate 48000
            channels 2
            format S16_LE
        }
    }
}

ctl.!default {
    type hw
    card 0
}
