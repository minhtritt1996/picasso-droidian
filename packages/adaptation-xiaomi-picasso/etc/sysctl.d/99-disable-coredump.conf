# Disable kernel coredump to avoid kernel 4.19 do_coredump NULL pointer dereference bug
kernel.core_pattern = |/bin/false
kernel.core_uses_pid = 0
fs.suid_dumpable = 0

# Reboot automatically on kernel panic/oops/hung tasks after 5 seconds
kernel.panic_on_oops = 1
kernel.panic = 5
kernel.hung_task_timeout_secs = 30
kernel.hung_task_panic = 1
kernel.softlockup_panic = 1

