name: build-picasso

on:
  push:
    paths:
      - 'kernel/**'
      - 'scripts/**'
      - 'device/picasso/blobs/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  bootimg:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
            python2 cpio kmod device-tree-compiler curl
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 10 || true
          python --version

      - name: Proton clang 13 (tested toolchain)
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang.git ~/proton-clang
          ~/proton-clang/bin/clang --version | head -n 1

      - name: mkbootimg (LineageOS mirror)
        run: |
          mkdir -p ~/tools
          curl -sL --retry 3 -o ~/tools/mkbootimg.py \
            https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-18.1/mkbootimg.py
          chmod +x ~/tools/mkbootimg.py
          head -n 3 ~/tools/mkbootimg.py

      - name: Kernel source (shallow)
        run: |
          git clone --depth 1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm7250.git kernel-src
          cd kernel-src
          for p in ../kernel/patches/0000-*.patch ../kernel/patches/0001-*.patch ../kernel/patches/01.*.patch ../kernel/patches/02.*.patch; do
            [ -f "$p" ] || continue
            patch -p1 --dry-run < "$p" >/dev/null 2>&1 && patch -p1 < "$p" || echo "skip $p"
          done

      - name: Build kernel (Proton clang 13)
        run: |
          cd kernel-src
          mkdir -p out_halium
          cp ../kernel/picasso_defconfig out_halium/.config
          export PATH="$HOME/proton-clang/bin:$PATH"
          make O=out_halium ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            PYTHON=python2 olddefconfig
          make O=out_halium ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            PYTHON=python2 -j"$(nproc)" Image.gz dtbs
          cat out_halium/include/config/kernel.release

      - name: Pack boot.img (proven picasso layout)
        run: |
          CMDLINE="earlycon=msm_geni_serial,0x4a90000 androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 androidboot.usbcontroller=a600000.dwc3 loop.max_part=7 androidboot.usbconfigfs=true androidboot.selinux=permissive"
          python3 ~/tools/mkbootimg.py \
            --kernel kernel-src/out_halium/arch/arm64/boot/Image.gz \
            --ramdisk device/picasso/blobs/ramdisk.cpio.gz \
            --dtb device/picasso/blobs/rec-picasso.dtb \
            --base 0x0 --pagesize 4096 \
            --kernel_offset 0x8000 --ramdisk_offset 0x1200000 \
            --tags_offset 0x100 --dtb_offset 0x1728000 \
            --header_version 2 --cmdline "$CMDLINE" \
            -o halium-boot-picasso.img
          md5sum halium-boot-picasso.img
          ls -la halium-boot-picasso.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot-picasso
          path: halium-boot-picasso.img
